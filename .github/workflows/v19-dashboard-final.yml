name: V19 Dashboard Final
on:
  push:
    paths:
      - ".github/workflows/v19-dashboard-final.yml"
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Grid 06 V19')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ObjectSetInteger(0,name,OBJPROP_FONTSIZE,12);','ObjectSetInteger(0,name,OBJPROP_FONTSIZE,8);')
          s=re.sub(r'^\s*CreateDashboardDivider\(DASH_PREFIX[^\n]*\);\s*\n','',s,flags=re.M)
          p.write_text(s,encoding='utf-8')
          assert 'ObjectSetInteger(0,name,OBJPROP_FONTSIZE,8);' in s
          assert 'ObjectSetString(0,name,OBJPROP_FONT,"Calibri");' in s
          assert 'ObjectSetInteger(0,name,OBJPROP_XSIZE,850);' in s
          assert 'ObjectSetInteger(0,name,OBJPROP_YSIZE,930);' in s
          assert "ColorToARGB(C'255,140,0',128)" in s
          assert 'CreateDashboardDivider(DASH_PREFIX' not in s
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Grid 06 V19'
          git commit -m "Finalize V19 dashboard styling"
          git push
      - name: Cleanup
        if: always()
        run: |
          git checkout -- 'Grid 06 V19' || true
          rm -f '.github/workflows/v19-dashboard-final.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary V19 workflow"
          git push || true
# trigger revision
