name: Build V19 dashboard
on:
  push:
    paths:
      - '.v19chunks/**'
permissions:
  contents: write
jobs:
  build-v19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble V19
        shell: bash
        run: |
          cat .v19chunks/01 .v19chunks/02 .v19chunks/03 .v19chunks/04 .v19chunks/05 > 'Grid 06 V19'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Grid 06 V19'
          git rm -r .v19chunks
          git commit -m 'Update V19 dashboard to Calibri 8 orange 50% without dividers'
          git push
